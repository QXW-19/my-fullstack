name: Deploy Fullstack to Aliyun Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/my-fullstack
            git fetch --all
            git reset --hard origin/main
            
            # 前端构建
            cd /www/wwwroot/my-fullstack/frontend
            npm install
            npm run build
            
            # 后端部署（暂时保持注释，前端跑通后再打开）
            # cd /www/wwwroot/my-fullstack/backend
            # npm install
            # pm2 restart all
