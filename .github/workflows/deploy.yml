name: Deploy Fullstack to Aliyun Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 进入项目目录并拉取最新代码
            cd /www/wwwroot/my-fullstack
            git fetch --all
            git reset --hard origin/main
            
            # 2. 构建前端
            cd /www/wwwroot/my-fullstack/frontend
            npm install
            npm run build
            
            # 3. 部署后端（请根据你的实际技术栈取消注释并修改）
            # 【如果是 Node.js + PM2】
            # cd /www/wwwroot/my-fullstack/backend
            # npm install
            # pm2 restart all
            
            # 【如果是 Python + systemd】
            # cd /www/wwwroot/my-fullstack/backend
            # pip install -r requirements.txt
            # systemctl restart your-backend
